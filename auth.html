<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lotus Ascension — Вход</title>
<link rel="icon" type="image/png" href="favicon-32.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(1200px 800px at 50% 20%, #241a3e 0%, #0d0a1a 70%);
    color:#e8e2f0; display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden; position:relative;
  }
  /* звёзды */
  .stars { position:fixed; inset:0; pointer-events:none; }
  .star { position:absolute; width:2px; height:2px; border-radius:50%; background:#fff; opacity:.7; animation: tw 3s infinite ease-in-out; }
  @keyframes tw { 0%,100%{opacity:.15} 50%{opacity:.8} }
  .card {
    width:min(380px, 92vw); background:rgba(20,14,34,.92);
    border:1px solid rgba(232,161,61,.35); border-radius:18px;
    padding:34px 28px 26px; text-align:center; position:relative; z-index:2;
    box-shadow:0 20px 60px rgba(0,0,0,.55);
  }
  .card.shake { animation: shk .4s; }
  @keyframes shk { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-9px)} 50%{transform:translateX(8px)} 75%{transform:translateX(-5px)} }
  .mono {
    width:74px; height:74px; margin:0 auto 14px; border-radius:50%;
    border:2px solid #e8a13d; display:flex; align-items:center; justify-content:center;
    font-size:30px; font-weight:700; color:#e8a13d; letter-spacing:1px;
    background:radial-gradient(circle, rgba(232,161,61,.14), transparent 70%);
  }
  h1 { font-size:22px; font-weight:600; color:#f3ead8; margin-bottom:4px; }
  .sub { font-size:12.5px; color:#9a8fb8; margin-bottom:22px; }
  label { display:block; text-align:left; font-size:12px; color:#b3a8cc; margin:12px 0 5px; }
  input[type=email], input[type=password] {
    width:100%; padding:12px 14px; border-radius:10px; font-size:15px;
    border:1px solid rgba(154,143,184,.35); background:rgba(8,6,16,.6); color:#f3ead8; outline:none;
  }
  input:focus { border-color:#e8a13d; }
  .row { display:flex; align-items:center; justify-content:space-between; margin-top:14px; font-size:12.5px; color:#b3a8cc; }
  .row label { margin:0; display:flex; gap:7px; align-items:center; cursor:pointer; }
  .err { color:#ff7b8a; font-size:12.5px; min-height:17px; margin-top:12px; }
  .btn {
    width:100%; margin-top:14px; padding:13px; border:none; border-radius:10px;
    font-size:15px; font-weight:600; cursor:pointer; color:#1a1206;
    background:linear-gradient(135deg, #e8a13d, #f4c069);
  }
  .btn.ghost { background:transparent; border:1px solid rgba(154,143,184,.4); color:#cfc4e6; }
  .hint { font-size:11.5px; color:#8d82aa; margin-top:16px; line-height:1.5; }
  .ok-badge { color:#7ddba3; font-size:12.5px; margin-top:12px; }
  .who { color:#cfc4e6; font-size:13px; margin-top:8px; }

  /* загрузка кубиками */
  #loader {
    position:fixed; inset:0; z-index:50; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(1000px 700px at 50% 30%, #1c1330 0%, #0d0a1a 70%);
  }
  #loader.show { display:flex; }
  .cubes { display:flex; gap:26px; margin-bottom:46px; }
  .cube {
    width:44px; height:44px; border-radius:9px; animation: hop 1.15s infinite ease-in-out;
    box-shadow:0 12px 24px rgba(0,0,0,.45);
  }
  .cube:nth-child(1){ background:linear-gradient(135deg,#e8a13d,#f4c069); animation-delay:0s; }
  .cube:nth-child(2){ background:linear-gradient(135deg,#2bb673,#3fd68f); animation-delay:.18s; }
  .cube:nth-child(3){ background:linear-gradient(135deg,#a45de8,#c17df2); animation-delay:.36s; }
  @keyframes hop {
    0%,100% { transform:translateY(0) rotate(0deg); }
    35%     { transform:translateY(-34px) rotate(22deg); }
    60%     { transform:translateY(0) rotate(0deg) scaleY(.92); }
    75%     { transform:translateY(0) rotate(0deg) scaleY(1); }
  }
  #load-msg { font-size:15px; color:#cfc4e6; min-height:22px; text-align:center; padding:0 24px; }
  .barwrap { width:min(320px,80vw); height:6px; border-radius:3px; background:rgba(255,255,255,.09); margin-top:26px; overflow:hidden; }
  #bar { height:100%; width:0%; border-radius:3px; background:linear-gradient(90deg,#e8a13d,#f4c069); transition:width .4s linear; }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="card" id="card">
    <div class="mono">LA</div>
    <h1 id="t-title">Lotus Ascension</h1>
    <div class="sub" id="t-sub">Вход в мир культиваторов</div>

    <div id="form-box" style="display:none">
      <label id="l-email">Почта героя</label>
      <input type="email" id="email" autocomplete="off" placeholder="hero@lotus.world">
      <label id="l-pass">Пароль</label>
      <input type="password" id="pass" placeholder="••••••">
      <div class="row">
        <label><input type="checkbox" id="remember" checked> <span id="l-rem">Запомнить меня (30 дней)</span></label>
      </div>
      <div class="err" id="err"></div>
      <button class="btn" id="btn-login">Войти в мир</button>
      <button class="btn ghost" id="btn-new">Создать нового героя</button>
      <div class="hint" id="t-hint">Пароль задаётся в игре: Настройки → Пароль.<br>Почта — Настройки → Профиль.</div>
    </div>

    <div id="info-box">
      <div class="err" id="info"></div>
      <button class="btn" id="btn-new2" style="display:none">Создать нового героя</button>
    </div>
  </div>

  <div id="loader">
    <div class="cubes"><div class="cube"></div><div class="cube"></div><div class="cube"></div></div>
    <div id="load-msg"></div>
    <div class="barwrap"><div id="bar"></div></div>
  </div>

<script>
(function(){
  var SAVE_KEY = 'nebesnyy_put_save_v2';
  var AUTH_KEY = 'lotus_auth_ok';
  var lang = 'ru';
  try { lang = (localStorage.getItem('np_lang') || 'ru').slice(0,2) === 'en' ? 'en' : 'ru'; } catch(e){}

  /* ─── тексты ─── */
  var T = {
    ru: {
      sub:'Вход в мир культиваторов', email:'Почта героя', pass:'Пароль',
      rem:'Запомнить меня (30 дней)', remShort:'Запомнить меня (12 часов)',
      login:'Войти в мир', newHero:'Создать нового героя',
      hint:'Пароль задаётся в игре: Настройки → Пароль.<br>Почта — Настройки → Профиль.',
      noSave:'Сейв героя не найден на этом устройстве.',
      enter:'Введи почту и пароль.', badEmail:'Такой почты нет в сейве этого героя.',
      badPass:'Неверный пароль. Пароль задаётся в Настройках игры.',
      msgs:[
        'Пробуждение духа…',
        'Небеса не жалуют нетерпеливых…',
        'Открытие небесных врат…',
        'Совет: вступи в гильдию — одинокий культиватор не переживёт первой бури 🏰',
        'Совет: пайка в сумке ценнее золота в кармане 🍖',
        'Страж Возвышения ждёт на каждой десятой вершине…',
        'Совет: корми питомца — и он отплатит силой 🐾',
        'Врата открыты. Добро пожаловать, культиватор…'
      ]
    },
    en: {
      sub:'Enter the world of cultivators', email:'Hero email', pass:'Password',
      rem:'Remember me (30 days)', remShort:'Remember me (12 hours)',
      login:'Enter the world', newHero:'Create a new hero',
      hint:'Password is set in-game: Settings → Password.<br>Email: Settings → Profile.',
      noSave:'No hero save found on this device.',
      enter:'Enter email and password.', badEmail:'No such email in this hero’s save.',
      badPass:'Wrong password. Set it in game Settings.',
      msgs:[
        'Awakening of the spirit…',
        'The heavens show no mercy to the impatient…',
        'Opening the celestial gates…',
        'Tip: join a guild — a lone cultivator will not survive the first storm 🏰',
        'Tip: rations in the bag are worth more than gold in the pocket 🍖',
        'The Ascension Guardian awaits on every tenth peak…',
        'Tip: feed your pet — it will repay you with strength 🐾',
        'The gates are open. Welcome, cultivator…'
      ]
    }
  }[lang];

  /* ─── звёзды ─── */
  var st = document.getElementById('stars');
  for (var i=0;i<70;i++){
    var s = document.createElement('div'); s.className='star';
    s.style.left = (Math.random()*100)+'%';
    s.style.top  = (Math.random()*100)+'%';
    s.style.animationDelay = (Math.random()*3)+'s';
    s.style.transform = 'scale('+(0.5+Math.random())+')';
    st.appendChild(s);
  }

  /* ─── локализация статичной разметки ─── */
  document.documentElement.lang = lang;
  document.title = 'Lotus Ascension — ' + (lang==='en'?'Sign in':'Вход');
  document.getElementById('t-sub').textContent = T.sub;
  document.getElementById('l-email').textContent = T.email;
  document.getElementById('l-pass').textContent = T.pass;
  document.getElementById('btn-login').textContent = T.login;
  document.getElementById('btn-new').textContent = T.newHero;
  document.getElementById('btn-new2').textContent = T.newHero;
  document.getElementById('t-hint').innerHTML = T.hint;

  /* ─── сейв ─── */
  var save = null;
  try { save = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch(e){ save = null; }

  var formBox = document.getElementById('form-box');
  var infoBox = document.getElementById('info-box');
  var info    = document.getElementById('info');

  function goNew(){
    window.location.href = 'index.html';
  }

  if (!save || !save.name){
    info.textContent = T.noSave;
    document.getElementById('btn-new2').style.display = 'block';
  } else {
    formBox.style.display = 'block';
    var em = save.email || save.authEmail || '';
    try { em = em || localStorage.getItem('np_email') || ''; } catch(e){}
    if (em) {
      var who = document.createElement('div');
      who.className = 'who';
      who.textContent = (lang==='en' ? 'Hero: ' : 'Герой: ') + save.name;
      formBox.insertBefore(who, formBox.firstChild);
    }
  }

  /* ─── проверка пароля: тем же кодированием, что игра ─── */
  function enc(p){ return btoa(unescape(encodeURIComponent(p))); }

  function shake(msg){
    var card = document.getElementById('card');
    document.getElementById('err').textContent = msg;
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  }

  function login(){
    var email = (document.getElementById('email').value||'').trim().toLowerCase();
    var pass  = document.getElementById('pass').value || '';
    if (!email || !pass){ shake(T.enter); return; }
    var okE = (save.email||'').trim().toLowerCase() === email
           || (save.authEmail||'').trim().toLowerCase() === email;
    if (!okE){ shake(T.badEmail); return; }
    var okP = false;
    if (save.passHash)      okP = save.passHash === enc(pass);
    else if (save.authPassHash) okP = save.authPassHash === enc(pass);
    else { shake(T.badPass); return; }
    if (!okP){ shake(T.badPass); return; }
    var days = document.getElementById('remember').checked ? 30 : 0.5;
    try { localStorage.setItem(AUTH_KEY, String(Date.now() + days*24*3600*1000)); } catch(e){}
    startLoader();
  }

  document.getElementById('btn-login').addEventListener('click', login);
  document.getElementById('pass').addEventListener('keydown', function(e){ if(e.key==='Enter') login(); });
  document.getElementById('remember').addEventListener('change', function(){
    document.getElementById('l-rem').textContent = this.checked ? T.rem : T.remShort;
  });
  document.getElementById('btn-new').addEventListener('click', goNew);
  document.getElementById('btn-new2').addEventListener('click', goNew);

  /* ─── загрузка кубиками ─── */
  function startLoader(){
    formBox.style.display = 'none'; infoBox.style.display = 'none';
    document.getElementById('loader').classList.add('show');
    var msg = document.getElementById('load-msg');
    var bar = document.getElementById('bar');
    var n = T.msgs.length, total = 2600, per = Math.max(260, total/n);
    var idx = 0;
    msg.textContent = T.msgs[0];
    var t0 = Date.now();
    var tick = setInterval(function(){
      var p = Math.min(100, (Date.now()-t0)/total*100);
      bar.style.width = p + '%';
      var ni = Math.min(n-1, Math.floor((Date.now()-t0)/per));
      if (ni !== idx){ idx = ni; msg.textContent = T.msgs[idx]; }
      if (p >= 100){ clearInterval(tick); window.location.href = 'index.html'; }
    }, 100);
  }
})();
</script>
</body>
</html>
